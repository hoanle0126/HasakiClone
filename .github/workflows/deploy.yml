name: Monorepo Deploy (Hybrid - Best Performance)

on:
  push:
    branches: [ "main" ]

jobs:
  # --- JOB 1: DEPLOY BACKEND (Giữ nguyên của bạn - Đã chuẩn) ---
  deploy-backend:
    name: 🚀 Deploy Backend
    runs-on: ubuntu-latest
    steps:
    - name: SSH & Deploy Laravel
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "---- BẮT ĐẦU DEPLOY BACKEND ----"
          cd /var/www/hasaki
          git pull origin main
          cd backend
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan queue:restart
          echo "✅ Backend deployed successfully!"

  # --- JOB 2: DEPLOY FRONTEND (SỬA LẠI CHO ĐÚNG) ---
  deploy-frontend:
    name: 🎨 Build & Deploy Frontend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # --- SỬA 1: Thêm biến môi trường API vào lúc Build ---
    - name: Install & Build
      env: 
        # Thay đúng đường dẫn API của bạn vào đây
        VITE_API_URL: "https://api.hasaki-clone.io.vn" 
      run: |
        cd frontend
        npm install
        npm run build
    
    # --- SỬA 2: Copy chính xác thư mục dist ---
    - name: Copy build to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        # Copy thư mục dist ở GitHub
        source: "frontend/dist"
        # Paste vào thư mục frontend trên VPS
        target: "/var/www/hasaki/frontend"
        # Ghi đè file cũ
        overwrite: true

    - name: Fix Permissions
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Cấp quyền lại cho Nginx đọc được file mới
          sudo chown -R www-data:www-data /var/www/hasaki/frontend/dist
          sudo chmod -R 755 /var/www/hasaki/frontend/dist
          echo "✅ Frontend Updated!"

  # --- JOB 3: THÔNG BÁO ---
  notify:
    name: 🔔 Notify n8n
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Send Notification
        run: |
           curl -X POST ${{ secrets.N8N_WEBHOOK }} \
           -H "Content-Type: application/json" \
           -d '{"message": "🚀 Hasaki Update: Đã deploy thành công (Hybrid Mode)!", "author": "${{ github.actor }}"}'