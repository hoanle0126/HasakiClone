name: Build and Deploy Docker

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. Build & Push Backend
      - name: Build Backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-app-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app-backend:latest

      # 3. Build & Push Frontend
      - name: Build Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-app-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app-frontend:latest

      # 4. Build & Push Socket
      - name: Build Socket Server
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-app-socket:latest ./socket
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app-socket:latest

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/my-project

            echo "→ Pull latest docker images"
            docker compose pull

            echo "→ Restart services"
            docker compose up -d --remove-orphans

            echo "→ Cleanup unused images"
            docker image prune -f
