name: Monorepo Deploy (Always Run)

on:
  push:
    branches: [ "main" ]

jobs:
  # --- JOB 1: DEPLOY BACKEND ---
  deploy-backend:
    name: 🚀 Deploy Backend
    runs-on: ubuntu-latest
    # Đã xóa dòng 'if' để lúc nào cũng chạy cho bạn dễ test
    
    steps:
    - name: SSH & Deploy Laravel
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "---- BẮT ĐẦU DEPLOY BACKEND ----"
          
          # 1. RA THƯ MỤC GỐC ĐỂ PULL CODE (Quan trọng)
          cd /var/www/hasaki
          git pull origin main
          
          # 2. VÀO BACKEND ĐỂ CHẠY LỆNH
          cd backend
          
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          echo "✅ Backend deployed successfully!"

  # --- JOB 2: DEPLOY FRONTEND ---
  deploy-frontend:
    name: 🎨 Deploy Frontend
    runs-on: ubuntu-latest
    # Đã xóa dòng 'if'
    
    steps:
    - name: SSH & Deploy ReactJS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "---- BẮT ĐẦU DEPLOY FRONTEND ----"
          
          # 1. RA THƯ MỤC GỐC ĐỂ PULL CODE
          cd /var/www/hasaki
          git pull origin main
          
          # 2. VÀO FRONTEND ĐỂ BUILD
          cd frontend
          npm install
          npm run build
          
          echo "✅ Frontend deployed successfully!"

  # --- JOB 3: THÔNG BÁO ---
  notify:
    name: 🔔 Notify n8n
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    
    steps:
      - name: Send Notification
        run: |
           curl -X POST ${{ secrets.N8N_WEBHOOK }} \
           -H "Content-Type: application/json" \
           -d '{"message": "🚀 Hasaki Update: Đã deploy code mới nhất lên VPS!", "author": "${{ github.actor }}"}'