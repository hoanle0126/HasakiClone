name: Monorepo Deploy (Auto Fix Git & RAM)

on:
  push:
    branches: [ "main" ]

jobs:
  # --- JOB 1: BACKEND ---
  deploy-backend:
    name: 🚀 Deploy Backend
    runs-on: ubuntu-latest
    steps:
    - name: SSH & Deploy Laravel
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "---- FIX GIT LOCK ----"
          git config --global --add safe.directory /var/www/hasaki
          cd /var/www/hasaki
          
          # DÒNG NÀY ĐỂ TỰ ĐỘNG SỬA LỖI 'cannot lock ref' NẾU BỊ LẠI
          rm -f .git/refs/remotes/origin/main
          
          echo "---- PULL CODE ----"
          git fetch --all
          git reset --hard origin/main
          
          echo "---- DEPLOY LARAVEL ----"
          cd backend
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          # Cấp quyền
          sudo chown -R www-data:www-data /var/www/hasaki/backend/storage
          
          echo "✅ Backend deployed successfully!"

  # --- JOB 2: FRONTEND ---
  deploy-frontend:
    name: 🎨 Deploy Frontend
    runs-on: ubuntu-latest
    steps:
    - name: SSH & Deploy ReactJS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "---- FIX GIT FRONTEND ----"
          git config --global --add safe.directory /var/www/hasaki
          cd /var/www/hasaki
          
          # Xóa ref lỗi
          rm -f .git/refs/remotes/origin/main
          
          git fetch --all
          git reset --hard origin/main
          
          echo "---- BUILD FRONTEND ----"
          cd frontend
          npm install
          
          # FIX LỖI RAM (Swap)
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run build
          
          # Cấp quyền
          sudo chown -R www-data:www-data /var/www/hasaki/frontend/dist
          
          echo "✅ Frontend deployed successfully!"

  # --- JOB 3: NOTIFY ---
  notify:
    name: 🔔 Notify n8n
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Send Notification Success
        if: needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success'
        run: |
           curl -X POST ${{ secrets.N8N_WEBHOOK }} \
           -H "Content-Type: application/json" \
           -d '{"message": "✅ Hasaki Update: Deploy THÀNH CÔNG (Đã fix Git Lock & RAM)!", "author": "${{ github.actor }}"}'

      - name: Send Notification Failure
        if: needs.deploy-backend.result == 'failure' || needs.deploy-frontend.result == 'failure'
        run: |
           curl -X POST ${{ secrets.N8N_WEBHOOK }} \
           -H "Content-Type: application/json" \
           -d '{"message": "❌ Hasaki Update: Vẫn lỗi! Kiểm tra log.", "author": "${{ github.actor }}"}'