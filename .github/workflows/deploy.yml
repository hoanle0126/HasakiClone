name: Monorepo Deploy (Sequential - No Conflict)

on:
  push:
    branches: [ "main" ]

jobs:
  # --- JOB 1: BACKEND (Đi trước mở đường) ---
  deploy-backend:
    name: 🚀 Deploy Backend & Pull Code
    runs-on: ubuntu-latest
    steps:
    - name: SSH & Deploy Laravel
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "---- 1. DỌN DẸP & PHÁ KHÓA GIT ----"
          cd /var/www/hasaki
          
          # Xóa mọi loại khóa có thể gây lỗi
          rm -f .git/index.lock
          rm -rf .git/refs/remotes/origin/main
          
          git config --global --add safe.directory /var/www/hasaki
          
          echo "---- 2. KÉO CODE (CHỈ LÀM 1 LẦN TẠI ĐÂY) ----"
          git fetch --all
          git reset --hard origin/main
          
          echo "---- 3. CHẠY LARAVEL ----"
          cd backend
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          # Cấp quyền storage
          sudo chown -R www-data:www-data /var/www/hasaki/backend/storage
          
          echo "✅ Backend Code Updated!"

  # --- JOB 2: FRONTEND (Chạy sau khi Backend xong) ---
  deploy-frontend:
    name: 🎨 Build Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend # <--- DÒNG QUAN TRỌNG NHẤT: Bắt phải đợi Backend xong mới chạy
    
    steps:
    - name: SSH & Build ReactJS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "---- 4. BUILD FRONTEND ----"
          # Không cần git pull nữa vì Backend đã kéo code mới về rồi
          
          cd /var/www/hasaki/frontend
          npm install
          
          # Fix RAM & Build
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run build
          
          # Cấp quyền cho thư mục dist
          sudo chown -R www-data:www-data /var/www/hasaki/frontend/dist
          
          echo "✅ Frontend Re-built!"

  # --- JOB 3: NOTIFY (Báo cáo) ---
  notify:
    name: 🔔 Notify n8n
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Send Notification
        run: |
           # Tôi giữ nguyên phần gán cứng URL của bạn để đảm bảo chạy được
           curl -X POST "https://n8n.tuantran.io.vn/webhook/deploy-success" \
           -H "Content-Type: application/json" \
           -d '{"message": "🚀 Hasaki Update: Full Flow hoàn tất (Backend -> Frontend)!", "author": "${{ github.actor }}"}'