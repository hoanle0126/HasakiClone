name: Monorepo Deploy (Auto Unlock & Deploy)

on:
  push:
    branches: [ "main" ]

jobs:
  # --- JOB 1: BACKEND ---
  deploy-backend:
    name: 🚀 Deploy Backend
    runs-on: ubuntu-latest
    steps:
    - name: SSH & Deploy Laravel
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "---- TỰ ĐỘNG PHÁ KHÓA GIT ----"
          cd /var/www/hasaki
          
          # ĐÂY LÀ DÒNG LỆNH CỨU TINH
          rm -f .git/index.lock
          
          # Fix lỗi quyền hạn luôn cho chắc
          git config --global --add safe.directory /var/www/hasaki
          
          echo "---- PULL CODE ----"
          git fetch --all
          git reset --hard origin/main
          
          echo "---- DEPLOY BACKEND ----"
          cd backend
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          # Cấp quyền lại
          sudo chown -R www-data:www-data /var/www/hasaki/backend/storage
          
          echo "✅ Backend deployed successfully!"

  # --- JOB 2: FRONTEND ---
  deploy-frontend:
    name: 🎨 Deploy Frontend
    runs-on: ubuntu-latest
    steps:
    - name: SSH & Deploy ReactJS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "---- TỰ ĐỘNG PHÁ KHÓA GIT (FRONTEND) ----"
          cd /var/www/hasaki
          
          # ĐÂY LÀ DÒNG LỆNH CỨU TINH
          rm -f .git/index.lock
          
          git config --global --add safe.directory /var/www/hasaki
          git fetch --all
          git reset --hard origin/main
          
          echo "---- BUILD FRONTEND ----"
          cd frontend
          npm install
          
          # Fix RAM
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run build
          
          # Cấp quyền
          sudo chown -R www-data:www-data /var/www/hasaki/frontend/dist
          
          echo "✅ Frontend deployed successfully!"

  # --- JOB 3: NOTIFY ---
  notify:
    name: 🔔 Notify n8n
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Send Notification
        run: |
           curl -X POST ${{ secrets.N8N_WEBHOOK }} \
           -H "Content-Type: application/json" \
           -d '{"message": "🚀 Hasaki Update: Đã tự động Fix lỗi và Deploy thành công!", "author": "${{ github.actor }}"}'