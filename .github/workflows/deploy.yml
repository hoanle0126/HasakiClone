name: Monorepo Deploy (Smart)

on:
  push:
    branches: [ "main" ]

jobs:
  # --- JOB 1: DEPLOY BACKEND (Laravel) ---
  deploy-backend:
    name: 🚀 Deploy Backend
    runs-on: ubuntu-latest
    # Chỉ chạy khi có file trong thư mục backend thay đổi
    if:  ${{ contains(github.event.head_commit.modified, 'backend/') || contains(github.event.head_commit.added, 'backend/') }}
    
    steps:
    - name: SSH & Deploy Laravel
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "---- BẮT ĐẦU DEPLOY BACKEND ----"
          # 1. Đi vào thư mục backend
          cd /var/www/hasaki/backend
          
          # 2. Update code (Lưu ý: git pull ở root hay subfolder đều kéo cả cục về)
          git pull origin main
          
          # 3. Cài đặt & Tối ưu
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          # 4. Restart Queue (Nếu có dùng Queue Worker gửi mail)
          php artisan queue:restart
          
          echo "✅ Backend deployed successfully!"

  # --- JOB 2: DEPLOY FRONTEND (React Vite) ---
  deploy-frontend:
    name: 🎨 Deploy Frontend
    runs-on: ubuntu-latest
    # Chỉ chạy khi có file trong thư mục frontend thay đổi
    if: ${{ contains(github.event.head_commit.modified, 'frontend/') || contains(github.event.head_commit.added, 'frontend/') }}
    
    steps:
    - name: SSH & Deploy ReactJS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "---- BẮT ĐẦU DEPLOY FRONTEND ----"
          # 1. Đi vào thư mục frontend
          cd /var/www/hasaki/frontend
          
          # 2. Update code
          git pull origin main
          
          # 3. Cài đặt thư viện mới (nếu có)
          npm install
          
          # 4. Build ra file tĩnh (Folder dist)
          npm run build
          
          echo "✅ Frontend deployed successfully!"

  # --- JOB 3: THÔNG BÁO n8n (Chạy khi 1 trong 2 thành công) ---
  notify:
    name: 🔔 Notify n8n
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend] # Chờ 2 thằng trên
    if: always() # Luôn chạy để báo cáo kết quả
    
    steps:
      - name: Send Notification
        run: |
           curl -X POST ${{ secrets.N8N_WEBHOOK }} \
           -H "Content-Type: application/json" \
           -d '{"message": "🚀 Hasaki Monorepo Update: Quá trình Deploy đã hoàn tất.", "author": "${{ github.actor }}"}'
