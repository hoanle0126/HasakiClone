name: Monorepo Deploy (Fixed Git Permission)

on:
  push:
    branches: [ "main" ]

jobs:
  # --- JOB 1: BACKEND ---
  deploy-backend:
    name: 🚀 Deploy Backend
    runs-on: ubuntu-latest
    steps:
    - name: SSH & Deploy Laravel
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Dừng ngay nếu có lỗi (Quan trọng)
          set -e
          
          echo "---- FIX GIT PERMISSION ----"
          git config --global --add safe.directory /var/www/hasaki
          
          echo "---- PULL CODE ----"
          cd /var/www/hasaki
          # Reset nhẹ để tránh conflict
          git reset --hard origin/main
          git pull origin main
          
          echo "---- DEPLOY LARAVEL ----"
          cd backend
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          # Cấp quyền lại cho chắc
          sudo chown -R www-data:www-data /var/www/hasaki/backend
          sudo chmod -R 775 /var/www/hasaki/backend/storage
          
          echo "✅ Backend deployed successfully!"

  # --- JOB 2: FRONTEND ---
  deploy-frontend:
    name: 🎨 Deploy Frontend
    runs-on: ubuntu-latest
    steps:
    - name: SSH & Deploy ReactJS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          
          # Fix git permission
          git config --global --add safe.directory /var/www/hasaki
          
          echo "---- PULL CODE FRONTEND ----"
          cd /var/www/hasaki
          git pull origin main
          
          echo "---- BUILD FRONTEND ----"
          cd frontend
          npm install
          # Build trên VPS (Đảm bảo bạn đã có Swap RAM)
          npm run build
          
          # Cấp quyền lại
          sudo chown -R www-data:www-data /var/www/hasaki/frontend/dist
          
          echo "✅ Frontend deployed successfully!"

  # --- JOB 3: NOTIFY (Sửa lại chuẩn cURL) ---
  notify:
    name: 🔔 Notify n8n
    runs-on: ubuntu-latest
    if: always() # Luôn chạy để báo cáo kể cả khi lỗi
    needs: [deploy-backend, deploy-frontend]
    steps:
      - name: Send Notification Success
        if: needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success'
        run: |
           curl -X POST ${{ secrets.N8N_WEBHOOK }} \
           -H "Content-Type: application/json" \
           -d '{"message": "✅ Hasaki Update: Deploy THÀNH CÔNG cả Frontend & Backend!", "author": "${{ github.actor }}"}'

      - name: Send Notification Failure
        if: needs.deploy-backend.result == 'failure' || needs.deploy-frontend.result == 'failure'
        run: |
           curl -X POST ${{ secrets.N8N_WEBHOOK }} \
           -H "Content-Type: application/json" \
           -d '{"message": "❌ Hasaki Update: Deploy THẤT BẠI! Hãy kiểm tra log ngay.", "author": "${{ github.actor }}"}'