services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
      - socket

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www

  backend-nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www
      - ./backend/backend-nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  socket:
    build: ./socket
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
